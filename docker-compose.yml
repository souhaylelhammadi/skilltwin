version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skilltwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skilltwin
      POSTGRES_PASSWORD: skilltwin_dev_password
      POSTGRES_DB: skilltwin_db
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: skilltwin_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
    container_name: skilltwin_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8020:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/__pycache__

  frontend:
    build:
      context: ./frontend
    container_name: skilltwin_frontend
    restart: unless-stopped
    ports:
      - "3010:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    
  minio:
    image: minio/minio:latest
    container_name: skilltwin_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: skilltwin
      MINIO_ROOT_PASSWORD: skilltwin_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
  
  celery_worker:
    build:
      context: ./backend
    container_name: skilltwin_celery_worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend:/app
      - /app/__pycache__

volumes:
  postgres_data:
  minio_data: